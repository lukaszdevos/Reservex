services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://reservex:reservex@postgres:5432/reservex
      REDIS_URL: redis://redis:6379
      STRIPE_SECRET_KEY: sk_test_placeholder
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reservex-network

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: reservex
      POSTGRES_PASSWORD: reservex
      POSTGRES_DB: reservex
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservex"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reservex-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reservex-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - reservex-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    networks:
      - reservex-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
    networks:
      - reservex-network

networks:
  reservex-network:
    driver: bridge
